naftiko: 1.0.0-alpha2
info:
  label: Navis N4 Terminal Operating System REST API — Operations
  description: 'Navis N4 Terminal Operating System REST API — Operations. 1 operations. Lead operation: Get active work queues.
    Self-contained Naftiko capability covering one Navis business surface.'
  tags:
  - Navis
  - Operations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NAVIS_API_KEY: NAVIS_API_KEY
capability:
  consumes:
  - type: http
    namespace: n4-operations
    baseUri: https://{terminal}.navis.example.com/apex/n4/api/v2
    description: Navis N4 Terminal Operating System REST API — Operations business capability. Self-contained, no shared references.
    resources:
    - name: work-queues
      path: /work-queues
      operations:
      - name: getworkqueues
        method: GET
        description: Get active work queues
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: craneId
          in: query
          type: string
        - name: status
          in: query
          type: string
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.NAVIS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: n4-operations-rest
    port: 8080
    description: REST adapter for Navis N4 Terminal Operating System REST API — Operations. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/work-queues
      name: work-queues
      description: REST surface for work-queues.
      operations:
      - method: GET
        name: getworkqueues
        description: Get active work queues
        call: n4-operations.getworkqueues
        with:
          craneId: rest.craneId
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: n4-operations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Navis N4 Terminal Operating System REST API — Operations. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: get-active-work-queues
      description: Get active work queues
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: n4-operations.getworkqueues
      with:
        craneId: tools.craneId
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
